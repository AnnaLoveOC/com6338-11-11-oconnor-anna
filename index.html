<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just One More Revision!</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <!-- Game Title -->
        <h1>Just One More Revision!</h1>

        <!-- Stress Meter -->
        <p id="stress">Stress: 20/100</p>

        <!-- Current Scene -->
        <section id="game">
            <h2 id="scene-title"></h2>
            <p id="email"></p>

            <!-- Player Choices -->
            <div id="choices"></div>
        </section>

        <!-- Restart Button -->
        <button id="restart" hidden>Restart Game</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
